<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro – Logística SNSC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-emerald-950 text-white min-h-screen flex flex-col justify-between">

  <div>
    <header class="bg-emerald-900 border-b border-emerald-800 shadow-lg">
      <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-emerald-700 rounded-full flex items-center justify-center font-black text-white shadow">
            LS
          </div>
          <div>
            <h1 class="text-lg font-bold text-white">Logística SNSC</h1>
            <p class="text-xs text-white">Ação Solidária</p>
          </div>
        </div>
        <a href="index.html" class="text-white hover:text-emerald-200 text-sm font-semibold">Voltar</a>
      </div>
    </header>

    <main class="max-w-lg mx-auto px-4 py-8">
      <section class="bg-emerald-900 border border-emerald-700 rounded-3xl p-6 sm:p-8 shadow-2xl">
        <h2 class="text-2xl font-extrabold text-white mb-6 text-center border-b border-emerald-800 pb-4">Seus Dados</h2>
        
        <form id="form-cadastro" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-white mb-1">Nome Completo</label>
            <input type="text" id="nome" required class="w-full bg-emerald-950 border border-emerald-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="Seu nome completo">
          </div>

          <div>
            <label class="block text-sm font-bold text-white mb-1">WhatsApp</label>
            <input type="tel" id="whatsapp" required class="w-full bg-emerald-950 border border-emerald-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="(00) 00000-0000">
          </div>

          <div>
            <label class="block text-sm font-bold text-white mb-1">Endereço</label>
            <input type="text" id="endereco" required class="w-full bg-emerald-950 border border-emerald-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="Rua, Número, Bairro">
          </div>

          <div>
            <label class="block text-sm font-bold text-white mb-1">Cidade</label>
            <input type="text" id="cidade" required class="w-full bg-emerald-950 border border-emerald-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="Sua Cidade">
          </div>

          <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-black py-4 rounded-xl shadow-xl transition text-lg tracking-wide uppercase border border-emerald-400 mt-4">
            Avançar para Escolher Números ➔
          </button>
        </form>
      </section>
    </main>
  </div>

  <footer class="bg-emerald-900/60 border-t border-emerald-800 py-4 text-center text-xs text-white">
    <p>Logística SNSC • Ação Solidária</p>
  </footer>

  <script>
    document.getElementById('form-cadastro').addEventListener('submit', (e) => {
      e.preventDefault();
      const dados = {
        nome: document.getElementById('nome').value,
        whatsapp: document.getElementById('whatsapp').value,
        endereco: document.getElementById('endereco').value,
        cidade: document.getElementById('cidade').value
      };
      sessionStorage.setItem('participante', JSON.stringify(dados));
      window.location.href = 'numeros.html';
    });
  </script>
</body>
</html>
