<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instituições – Logística SNSC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-emerald-950 text-white min-h-screen flex flex-col justify-between">

  <header class="bg-emerald-900 border-b border-emerald-800 shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center font-black text-white shadow-lg text-xl border border-emerald-400">
          LS
        </div>
        <div>
          <h1 class="text-xl font-bold text-white leading-tight">Logística SNSC</h1>
          <p class="text-xs text-emerald-300 font-medium">Portal de Apoio Institucional & Ações Solidárias</p>
        </div>
      </div>
      <nav class="flex items-center gap-4 text-sm font-semibold">
        <a href="index.html" class="text-emerald-200 hover:text-white transition">Início</a>
        <a href="instituicoes.html" class="text-white border-b-2 border-emerald-400 pb-1 transition">Instituições</a>
        <a href="meus-numeros.html" class="bg-emerald-700 hover:bg-emerald-600 px-4 py-2 rounded-xl text-white transition border border-emerald-500 shadow">Meus Prêmios</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-black mb-2">Instituições Parceiras</h2>
      <p class="text-sm text-emerald-300">Escolha uma causa abaixo para apoiar diretamente.</p>
    </div>

    <div id="lista-instituicoes" class="space-y-6">
      <div class="text-center text-emerald-300 py-12">Carregando instituições...</div>
    </div>
  </main>

  <footer class="bg-emerald-900/60 border-t border-emerald-800 py-6 text-center text-xs text-emerald-400 mt-12">
    <p>© Logística SNSC • Compromisso Social e Transparência</p>
  </footer>

  <script>
    async function carregarInstituicoes() {
      const container = document.getElementById('lista-instituicoes');

      try {
        const { data, error } = await window._supabase
          .from('instituicoes')
          .select('*');

        if (error) {
          throw error;
        }

        if (!data || data.length === 0) {
          container.innerHTML = '<p class="text-center text-emerald-300">Nenhuma instituição cadastrada no momento.</p>';
          return;
        }

        let html = '';
        data.forEach(inst => {
          const arrecadado = inst.arrecadado || 0;
          const meta = inst.meta || 5000;
          const porcentagem = Math.min(Math.round((arrecadado / meta) * 100), 100);

          html += `
            <div class="bg-emerald-900/60 border border-emerald-800 rounded-3xl p-6 shadow-xl">
              <div class="flex items-center justify-between mb-3">
                <span class="bg-emerald-700/80 text-emerald-200 text-xs font-bold px-3 py-1 rounded-full border border-emerald-600">
                  ${inst.categoria || 'Ação Solidária'}
                </span>
                <span class="text-xs text-emerald-300 flex items-center gap-1">
                  📍 ${inst.cidade || 'São Luís - MA'}
                </span>
              </div>

              <h3 class="text-xl font-extrabold text-white mb-2">${inst.nome}</h3>
              <p class="text-sm text-emerald-200/90 mb-4">${inst.descricao || ''}</p>

              <div class="space-y-1 mb-6">
                <div class="flex justify-between text-xs font-semibold text-emerald-300">
                  <span>Arrecadado: R$ ${arrecadado.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                  <span>${porcentagem}%</span>
                </div>
                <div class="w-full bg-emerald-950 rounded-full h-3 border border-emerald-800 overflow-hidden">
                  <div class="bg-emerald-400 h-full rounded-full transition-all duration-500" style="width: ${porcentagem}%"></div>
                </div>
                <div class="text-right text-[11px] text-emerald-400 font-medium">
                  Meta: R$ ${meta.toLocaleString('pt-BR', {minimumFractionDigits: 2})}
                </div>
              </div>

              <a href="numeros.html?id=${inst.id}" class="block text-center w-full bg-emerald-500 hover:bg-emerald-400 text-emerald-955 font-extrabold py-3 rounded-2xl shadow-lg transition text-emerald-950">
                Apoiar Instituição ➔
              </a>
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (err) {
        console.error('Erro:', err);
        container.innerHTML = '<div class="text-center text-red-400 p-6 bg-red-950/40 border border-red-800 rounded-2xl">Erro ao carregar dados do banco. Verifique sua conexão ou as políticas do Supabase.</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', carregarInstituicoes);
  </script>
</body>
</html>
