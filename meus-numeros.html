<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escolher Números – Logística SNSC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-emerald-950 text-white min-h-screen flex flex-col justify-between">

  <div>
    <header class="bg-emerald-900 border-b border-emerald-800 shadow-lg">
      <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-emerald-700 rounded-full flex items-center justify-center font-black text-white shadow">
            LS
          </div>
          <div>
            <h1 class="text-lg font-bold text-white">Logística SNSC</h1>
            <p class="text-xs text-white">Ação Solidária</p>
          </div>
        </div>
        <nav class="flex gap-3 text-sm font-semibold">
          <a href="index.html" class="text-white hover:text-emerald-200 px-4 py-2 transition">Início</a>
          <a href="meus-numeros.html" class="text-white hover:text-emerald-200 px-4 py-2 transition">Prêmios</a>
        </nav>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8">
      <section class="text-center mb-6">
        <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-2">Escolha seus Números</h2>
        <p class="text-white text-sm">Clique nos quadrados para selecionar. Cada número custa <strong>R$ 10,00</strong>.</p>
      </section>

      <section class="bg-emerald-900 border border-emerald-700 rounded-3xl p-6 shadow-xl">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6 border-b border-emerald-800 pb-4 text-sm font-bold">
          <div class="flex gap-4">
            <div class="flex items-center gap-2"><span class="w-4 h-4 bg-emerald-800 border border-emerald-600 rounded"></span><span>Livre</span></div>
            <div class="flex items-center gap-2"><span class="w-4 h-4 bg-blue-600 border border-blue-400 rounded"></span><span>Selecionado</span></div>
            <div class="flex items-center gap-2"><span class="w-4 h-4 bg-red-600 border border-red-500 rounded"></span><span>Ocupado</span></div>
          </div>
          <div class="text-right">
            <p class="text-xs text-white">Selecionados: <span id="qtd-selecionados" class="text-emerald-300 font-extrabold">0</span></p>
            <p class="text-lg font-black text-white">Total: <span id="valor-total-selecao" class="text-emerald-300">R$ 0,00</span></p>
          </div>
        </div>

        <div id="grid-numeros" class="grid grid-cols-5 sm:grid-cols-10 gap-2.5">

        </div>

        <div class="mt-8">
          <button id="btn-gerar-pix" disabled class="w-full bg-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-emerald-400 text-white font-black py-4 rounded-xl uppercase transition border border-emerald-400 shadow-lg text-lg">
            GERAR PIX
          </button>
        </div>
      </section>
    </main>
  </div>

  <footer class="bg-emerald-900/60 border-t border-emerald-800 py-4 mt-8 text-center text-xs text-white">
    <p>Logística SNSC • Ação Solidária</p>
  </footer>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
