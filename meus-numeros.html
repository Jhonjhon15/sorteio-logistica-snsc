<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Números – Logística SNSC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-emerald-950 text-gray-100 min-h-screen flex flex-col justify-between">

  <div>
    <header class="bg-emerald-900 border-b border-emerald-800 shadow-lg">
      <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <img src="assets/images/santuario.png" alt="Santuário" class="w-12 h-12 object-contain bg-white rounded-full p-1 shadow">
          <img src="assets/images/logo-logistica.png" alt="Logística SNSC" class="w-12 h-12 object-contain bg-white rounded-full p-1 shadow">
          <div>
            <h1 class="text-lg font-bold text-white">Logística SNSC</h1>
            <p class="text-xs text-emerald-300">Ação Solidária</p>
          </div>
        </div>
        <nav class="flex gap-3 text-sm font-semibold">
          <a href="index.html" class="text-emerald-200 hover:text-white px-4 py-2 transition">Início</a>
          <a href="meus-numeros.html" class="bg-emerald-700 text-white px-4 py-2 rounded-xl hover:bg-emerald-600 transition shadow">Meus Números</a>
        </nav>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 space-y-8">

      <section class="bg-emerald-900 border border-emerald-700/60 rounded-3xl p-6 shadow-xl">
        <h3 class="text-xl font-extrabold text-center text-white mb-6 border-b border-emerald-800 pb-3">🏆 Premiação do Sorteio</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
          <div class="bg-emerald-950/80 p-4 rounded-2xl border border-emerald-700/40">
            <p class="text-xs font-bold text-amber-400 uppercase">1º Lugar</p>
            <p class="text-lg font-black text-white mt-1">Prêmio Principal</p>
          </div>
          <div class="bg-emerald-950/80 p-4 rounded-2xl border border-emerald-700/40">
            <p class="text-xs font-bold text-gray-300 uppercase">2º Lugar</p>
            <p class="text-lg font-black text-white mt-1">Segundo Prêmio</p>
          </div>
          <div class="bg-emerald-950/80 p-4 rounded-2xl border border-emerald-700/40">
            <p class="text-xs font-bold text-amber-600 uppercase">3º Lugar</p>
            <p class="text-lg font-black text-white mt-1">Terceiro Prêmio</p>
          </div>
        </div>
      </section>

      <section class="bg-emerald-900 border border-emerald-700/60 rounded-3xl p-6 sm:p-8 shadow-xl max-w-lg mx-auto">
        <h3 class="text-xl font-extrabold text-white mb-4 text-center">Consultar Meus Números</h3>
        <p class="text-emerald-200 text-sm text-center mb-6">Digite o WhatsApp utilizado na doação para visualizar seus bilhetes.</p>
        
        <form id="form-consulta" class="space-y-4">
          <input type="tel" id="consulta-whatsapp" required class="w-full bg-emerald-950 border border-emerald-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400 focus:outline-none placeholder-emerald-600" placeholder="(00) 00000-0000">
          <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-black py-3.5 rounded-xl transition uppercase tracking-wide">
            Consultar Bilhetes
          </button>
        </form>

        <div id="resultado-consulta" class="mt-6 hidden space-y-4"></div>
      </section>
    </main>
  </div>

  <footer class="bg-emerald-900/60 border-t border-emerald-800 py-4 mt-8 text-center text-xs text-emerald-300">
    <p>Logística SNSC • Ação Solidária</p>
  </footer>

  <script src="js/supabase-config.js"></script>
  <script src="js/meus-numeros.js"></script>
</body>
</html>
