<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ação Solidária – Logística SNSC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-emerald-950 text-white min-h-screen flex flex-col justify-between">

  <div>

    <header class="bg-emerald-900 border-b border-emerald-800 shadow-lg">
      <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-emerald-700 rounded-full flex items-center justify-center font-black text-white shadow">
            LS
          </div>
          <div>
            <h1 class="text-lg font-bold text-white">Logística SNSC</h1>
            <p class="text-xs text-white">Ação Solidária</p>
          </div>
        </div>
        <nav class="flex gap-3 text-sm font-semibold">
          <a href="index.html" class="bg-emerald-700 text-white px-4 py-2 rounded-xl hover:bg-emerald-600 transition shadow">Início</a>
          <a href="meus-numeros.html" class="text-white hover:text-emerald-200 px-4 py-2 transition">Prêmios</a>
        </nav>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8">
      <section class="text-center mb-8">
        <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-2">Ação Solidária – Logística SNSC</h2>
        <p class="text-white text-base font-medium">Doe e concorra! Preencha seus dados para escolher seus números.</p>
      </section>

      <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div class="bg-emerald-900/90 p-5 rounded-2xl border border-emerald-700 text-center shadow-lg">
          <p class="text-xs font-bold text-white uppercase tracking-wider">TOTAL ARRECADADO</p>
          <p id="total-arrecadado" class="text-2xl font-black text-white mt-1">R$ 0,00</p>
        </div>

        <a href="numeros.html" class="bg-emerald-900/90 p-5 rounded-2xl border border-emerald-700 text-center shadow-lg hover:border-emerald-400 transition cursor-pointer group">
          <p class="text-xs font-bold text-white uppercase tracking-wider group-hover:text-emerald-300">NÚMEROS DISPONÍVEIS ↗</p>
          <p id="total-numeros" class="text-2xl font-black text-white mt-1">100 Números</p>
        </a>

        <div class="bg-emerald-900/90 p-5 rounded-2xl border border-emerald-700 text-center shadow-lg">
          <p class="text-xs font-bold text-white uppercase tracking-wider">STATUS</p>
          <p id="status-sorteio" class="text-2xl font-black text-white mt-1">Ativo</p>
        </div>
      
      <section class="bg-emerald-900 border border-emerald-700 rounded-3xl p-6 sm:p-8 shadow-2xl max-w-lg mx-auto">
        <h3 class="text-xl font-extrabold text-white mb-6 text-center border-b border-emerald-800 pb-4">Dados do Doador</h3>
        
        <form id="form-cadastro-inicial" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-white mb-1">Nome Completo</label>
            <input type="text" id="nome" required class="w-full bg-emerald-950 border border-emerald-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400 focus:outline-none placeholder-emerald-500" placeholder="Seu nome completo">
          </div>

          <div>
            <label class="block text-sm font-bold text-white mb-1">WhatsApp</label>
            <input type="tel" id="whatsapp" required class="w-full bg-emerald-950 border border-emerald-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400 focus:outline-none placeholder-emerald-500" placeholder="(00) 00000-0000">
          </div>

          <div>
            <label class="block text-sm font-bold text-white mb-1">Endereço</label>
            <input type="text" id="endereco" required class="w-full bg-emerald-950 border border-emerald-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400 focus:outline-none placeholder-emerald-500" placeholder="Rua, Número, Bairro">
          </div>

          <div>
            <label class="block text-sm font-bold text-white mb-1">Cidade</label>
            <input type="text" id="cidade" required class="w-full bg-emerald-950 border border-emerald-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400 focus:outline-none placeholder-emerald-500" placeholder="Sua Cidade">
          </div>

          <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-black py-4 rounded-xl shadow-xl transition text-lg tracking-wide uppercase border border-emerald-400 mt-4">
            Avançar para Escolher Números ➔
          </button>
        </form>
      </section>
    </main>
  </div>

  <footer class="bg-emerald-900/60 border-t border-emerald-800 py-4 mt-8 text-center text-xs text-white">
    <p>Logística SNSC • Ação Solidária</p>
  </footer>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
