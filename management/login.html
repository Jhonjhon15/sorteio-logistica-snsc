<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo — Logística do Santuário</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              950: '#020617', 900: '#064e3b', 800: '#065f46',
              700: '#047857', 600: '#059669', 500: '#10b981',
              400: '#34d399', 300: '#6ee7b7', 200: '#a7f3d0', 100: '#d1fae5'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .gradient-bg { 
      background: radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 10% 90%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                  #020617; 
      background-attachment: fixed;
    }
    .card-glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(52, 211, 153, 0.15);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="gradient-bg text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="card-glass w-full max-w-md p-8 rounded-3xl shadow-2xl relative overflow-hidden">
    <div class="absolute inset-0 bg-emerald-500/5 pointer-events-none"></div>

    <div class="text-center mb-8 relative z-10">

      <div class="flex justify-center mb-4">
        <div class="relative">
          <div class="absolute inset-0 bg-emerald-500/20 blur-xl rounded-full"></div>
          <img src="../assets/nossa-senhora-da-conceicao.png" alt="Nossa Senhora da Conceição" class="relative w-20 h-20 object-contain drop-shadow-[0_0_15px_rgba(16,185,129,0.3)]">
        </div>
      </div>

      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 mb-3 border border-emerald-500/20">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h2 class="text-xs font-bold text-emerald-400 tracking-[0.2em] uppercase mb-1">Área Restrita</h2>
      <h1 class="text-2xl font-extrabold tracking-tight text-white">Painel Administrativo</h1>
      <p class="text-sm text-slate-300 mt-1">Entre com suas credenciais para gerenciar o sistema</p>
    </div>

    <form id="form-login" class="space-y-5 relative z-10">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">E-mail do Administrador</label>
        <input type="email" id="login-email" required class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors text-sm" placeholder="admin@santuario.com">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Senha</label>
        <input type="password" id="login-senha" required class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors text-sm" placeholder="••••••••">
      </div>

      <button type="submit" id="btn-entrar" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg shadow-emerald-950/40 cursor-pointer text-sm">
        Entrar no Sistema
      </button>
    </form>
    
    <div class="mt-6 text-center relative z-10">
      <a href="../index.html" class="text-xs text-slate-400 hover:text-emerald-400 transition-colors">← Voltar para o site principal</a>
    </div>
  </div>

  <script src="../js/supabase-config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const formLogin = document.getElementById('form-login');
      
      formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('login-email').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        const btnEntrar = document.getElementById('btn-entrar');

        btnEntrar.disabled = true;
        btnEntrar.innerText = 'Autenticando...';

        try {
          const supabaseClient = getSupabase();
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: senha
          });

          if (error) throw error;

          window.location.href = '../admin.html';

        } catch (err) {
          console.error('Erro no login:', err);
          alert('Falha ao entrar: ' + (err.message || 'Verifique seu e-mail e senha.'));
          btnEntrar.disabled = false;
          btnEntrar.innerText = 'Entrar no Sistema';
        }
      });
    });
  </script>
</body>
</html>
